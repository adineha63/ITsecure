
name: IT Secure Content Draft Generator

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Get website repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate content draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_content.py

      - name: Save draft as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: itsecure-content-draft
          path: output/*.md
          if-no-files-found: error
          retention-days: 7
